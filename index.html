        <div>
        <button type="button" class="btn btn-primary" data-bs-toggle="button" onclick="local()">Location</button>
        </div>

        <script>
        function    local() {
            navigator.geolocation.getCurrentPosition(function(position) {
            let text = "Lat: " + position.coords.latitude + "   Long: " + position.coords.longitude;
            document.getElementById("demo").innerHTML = text;           });
        }
        </script>
        <p id="demo"></p>

        <h4 class="w3-center" id="demo1">Mountains that I climbed</h4>
        <div class="w3-content w3-display-container w3-border-black" align="center">
          <img class="mySlides" src="Lucio_Jalapao.jpg" style="width:50%" onmousemove=jalapao1()>
          <img class="mySlides" src="Jalapao.jpg" style="width:50%" onmousemove=jalapao2()>
          <img class="mySlides" src="Marumbi.jpg" style="width:50%" onmousemove=marumbi()>
          <img class="mySlides" src="Pico_Parana.jpg" style="width:50%" onmousemove=pp()>
          <img class="mySlides" src="Itapiroca.jpg" style="width:50%" onmousemove=itapiroca()>
          <img class="mySlides" src="Tucum.jpg" style="width:50%" onmousemove=tucum()>
          <img class="mySlides" src="Morro_Coroa.jpg" style="width:50%" onmousemove=coroa()>
          <button class="w3-button w3-display-bottomleft" onclick="plusDivs(-1)">&#10094;</button>
          <button class="w3-button w3-display-bottomright" onclick="plusDivs(1)">&#10095;</button>
       </div>
       <a href="mailto:luciotonon@yahoo.com.br">Lucio Mauro Micheletti Tonon</a>

        <script>
        var slideIndex = 1;
        showDivs(slideIndex);

        function plusDivs(n) {
          showDivs(slideIndex += n);
        }

        function showDivs(n) {
          var i;
          var x = document.getElementsByClassName("mySlides");
          if (n > x.length) {slideIndex = 1}
          if (n < 1) {slideIndex = x.length}
          for (i = 0; i < x.length; i++) {
            x[i].style.display = "none";
          }
          x[slideIndex-1].style.display = "block";
        }

        function jalapao1() {
            document.getElementById("demo1").innerHTML = "Lucio in Jalapao";
        }
        function jalapao2() {
            document.getElementById("demo1").innerHTML = "Jalapao - Tocantins - Brazil";
        }
        function marumbi() {
            document.getElementById("demo1").innerHTML = "Pico Marumbi - Parana - Brazil";
        }
        function pp() {
            document.getElementById("demo1").innerHTML = "Pico Parana - Brazil";
        }
        function itapiroca() {
            document.getElementById("demo1").innerHTML = "Itapiroca - Parana - Brazil";
        }
        function tucum() {
            document.getElementById("demo1").innerHTML = "Tucum - Parana - Brazil";
        }
        function coroa() {
            document.getElementById("demo1").innerHTML = "Morro da Coroa - Florianopolis - Brazil";
        }
        </script>
